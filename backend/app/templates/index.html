<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>X-Panel</title>


<style>

body{
    background:#111827;
    font-family:tahoma;
}


.box{

width:350px;
margin:120px auto;
background:#1f2937;
padding:30px;
border-radius:10px;
color:white;

}


input{

width:100%;
padding:12px;
margin:10px 0;
border-radius:5px;
border:0;

}


button{

width:100%;
padding:12px;
background:#2563eb;
color:white;
border:0;
border-radius:5px;

}

</style>


</head>


<body>


<div class="box">


<h2>
X-PANEL
</h2>


<form action="/login" method="post">


<input 
name="username"
placeholder="Username">


<input 
name="password"
type="password"
placeholder="Password">


<button>
Login
</button>


</form>


</div>


</body>

</html>
